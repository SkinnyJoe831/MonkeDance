<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i like pie</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #00c853, #00e676, #1de9b6);
            overflow: hidden;
        }

        .monkey {
            width: 200px;
            margin-top: 20px;
            animation: float 2s ease-in-out infinite;
            position: absolute; /* 🔥 added so monke can move */
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0); }
        }

        /* sparkle particles */
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, white, transparent);
            border-radius: 50%;
            opacity: 0.8;
            animation: drift 6s linear infinite;
        }

        @keyframes drift {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0.7; }
            100% { transform: translateY(-20vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

    Hey buddy.
    <br>

    <!-- 🔥 added id="monke" -->
    <img id="monke" class="monkey"
         src="https://media.tenor.com/9C2R4Y3vP7YAAAAM/monkey-dance.gif"
         alt="Dancing Monkey">

    <script>
        // spawn sparkles
        for (let i = 0; i < 30; i++) {
            let s = document.createElement("div");
            s.classList.add("sparkle");
            s.style.left = Math.random() * 100 + "vw";
            s.style.animationDelay = Math.random() * 6 + "s";
            s.style.animationDuration = 4 + Math.random() * 4 + "s";
            document.body.appendChild(s);
        }

        // 🔥 monke movement logic
        const monke = document.getElementById('monke');

        function moveMonke(e) {
            let x = e.clientX || e.touches?.[0]?.clientX;
            let y = e.clientY || e.touches?.[0]?.clientY;

            // Smooth motion
            monke.style.transition = "transform 0.25s ease-out";

            // Center monke on the tapped spot
            monke.style.transform = `translate(${x - 100}px, ${y - 100}px)`;
        }

        document.addEventListener("click", moveMonke);
        document.addEventListener("touchstart", moveMonke);
    </script>

</body>
</html>
